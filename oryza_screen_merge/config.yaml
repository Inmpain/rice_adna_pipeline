# Output directory for the merged candidate-Oryza FASTQs.
output_dir: /home/zxr619/zxr619/zxr619/rice/data/bam/asian_rice_panel_screen_merged

# These directories must contain candidate FASTQs that have already been
# screened against the Asian rice panel. Each pattern needs a {sample} wildcard.
sources:
  shotgun:
    directory: /home/zxr619/zxr619/zxr619/rice/data/bam/asian_rice_panel_screen/per_sample_mapped_fastq
    pattern: "{sample}.asian_rice_panel.primary_mapped.fastq.gz"

  panel1:
    directory: /absolute/path/to/panel1_candidate_fastq
    pattern: "{sample}.asian_rice_panel.primary_mapped.fastq.gz"

  panel2:
    directory: /absolute/path/to/panel2_candidate_fastq
    pattern: "{sample}.asian_rice_panel.primary_mapped.fastq.gz"
